name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Configure strict CPU contracts
        run: >-
          cmake -S . -B build
          -DEVO_CUDA=OFF
          -DEVO_NPY=OFF
          -DEVO_SANITIZE=ON
          -DEVO_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
